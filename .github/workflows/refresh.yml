name: Refresh catalog
on:
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: catalog-write, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/add.ts --refresh
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git config user.name "ideas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos
          git diff --cached --quiet || (git commit -m "refresh: stars, topics and categories" && git push)
